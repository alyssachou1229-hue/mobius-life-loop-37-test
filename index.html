<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MÖBIUS LIFE LOOP 4.0｜Research Beta 1</title><style>*{box-sizing:border-box}body{margin:0;background:#151020;color:#f4effa;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;line-height:1.65}main{max-width:740px;margin:auto;padding:24px 16px 72px}.brand{color:#e5c48b;letter-spacing:.13em;font-weight:700}.hero{padding:32px 22px;background:radial-gradient(circle at 80% 0%,#58416b,#251b34 65%);border:1px solid #6d5379;border-radius:24px;margin:20px 0}h1{font-size:2rem;line-height:1.3}h2{font-size:1.35rem}h3{font-size:1.08rem;color:#e5c48b}.muted,small{color:#c9bfd4}.card{background:#281f36;border:1px solid #50415e;border-radius:18px;padding:20px;margin:14px 0}.tag{color:#e5c48b;font-size:.8rem;font-weight:700}.btn{border:0;background:#dfbe86;color:#1b1425;border-radius:12px;padding:13px 18px;font-size:1rem;font-weight:700;cursor:pointer}.btn.secondary{background:#473957;color:#fff}.btn:disabled{opacity:.35;cursor:not-allowed}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.choices{display:grid;gap:9px;margin:16px 0}.choice{display:block;border:1px solid #62516f;background:#33283f;border-radius:12px;padding:11px 14px;cursor:pointer}.choice:has(input:checked){border-color:#dfbe86;background:#514064}.choice input{margin-right:10px;accent-color:#e5c48b}.progress{height:7px;background:#40334d;border-radius:10px;overflow:hidden}.progress>div{height:100%;background:#e5c48b;transition:width .2s}.bar{height:8px;background:#4c3e5a;border-radius:8px;overflow:hidden;flex:1}.bar>div{height:100%;background:#c8a978}.score{display:flex;align-items:center;gap:10px;margin:9px 0}.score strong{width:48px}.evidence{padding:12px;border-left:3px solid #e5c48b;background:#352943;margin:8px 0}select,textarea{width:100%;padding:12px;background:#382c47;border:1px solid #6d587b;border-radius:10px;color:white;font:inherit}button{margin-top:8px}details{border:1px solid #53435e;padding:10px 14px;border-radius:12px;margin:10px 0}summary{cursor:pointer;color:#e5c48b}.note{font-size:.85rem;color:#c9bfd4}a{color:#e5c48b}#app{min-height:400px}</style></head><body><main><div id="app"></div><footer class="note">MÖBIUS Research Beta 1 · 未經心理計量驗證 · 本機互動示範 · 不會自動上傳資料</footer></main><script>
const BANK={"version": "4.0-research-beta1", "domains": [{"name": "關係", "definition": "在互動中如何回應不確定與需求"}, {"name": "價值", "definition": "在評價自己時如何看待表現與認可"}, {"name": "金錢", "definition": "在財務決策中如何面對不確定"}, {"name": "行動", "definition": "在啟動與推進計畫時的反應"}, {"name": "家庭", "definition": "在家庭期待與個人需要之間的反應"}, {"name": "方向", "definition": "在目標與選擇之間的反應"}], "questions": [{"id": "01-01", "domain": "關係", "text": "對方回覆比平常簡短時，我會反覆猜測自己是否做錯事。", "direction": 1}, {"id": "01-02", "domain": "關係", "text": "即使擔心對方失望，我通常仍能清楚表達自己的需要。", "direction": -1}, {"id": "01-03", "domain": "關係", "text": "遇到意見不合時，我常先答應，之後才感到委屈。", "direction": 1}, {"id": "01-04", "domain": "關係", "text": "一段互動不順利後，我會花很多時間回想細節。", "direction": 1}, {"id": "01-05", "domain": "關係", "text": "當別人的期待與我的能力衝突時，我能提出可行的界線。", "direction": -1}, {"id": "02-01", "domain": "價值", "text": "做完一件事後，我常先注意不足之處，而不是已完成的部分。", "direction": 1}, {"id": "02-02", "domain": "價值", "text": "即使別人沒有稱讚，我仍能肯定自己付出的努力。", "direction": -1}, {"id": "02-03", "domain": "價值", "text": "看到同齡人取得成就，我容易懷疑自己的價值。", "direction": 1}, {"id": "02-04", "domain": "價值", "text": "當表現不如預期，我會把單次失誤看成自己不夠好。", "direction": 1}, {"id": "02-05", "domain": "價值", "text": "我能區分「這件事沒做好」和「我這個人不好」。", "direction": -1}, {"id": "03-01", "domain": "金錢", "text": "遇到必要但金額較大的支出，我會因反覆擔心而難以決定。", "direction": 1}, {"id": "03-02", "domain": "金錢", "text": "我能依實際預算做選擇，而不只是被當下的擔憂左右。", "direction": -1}, {"id": "03-03", "domain": "金錢", "text": "即使支出已經仔細評估，我仍常反覆後悔。", "direction": 1}, {"id": "03-04", "domain": "金錢", "text": "比較別人的收入或消費後，我容易質疑自己的財務決定。", "direction": 1}, {"id": "03-05", "domain": "金錢", "text": "當財務資訊不足時，我會先確認數字與條件，再決定。", "direction": -1}, {"id": "04-01", "domain": "行動", "text": "有想做的事時，我常持續查資料，卻遲遲沒有實作。", "direction": 1}, {"id": "04-02", "domain": "行動", "text": "即使還不確定結果，我通常能先完成一個小步驟。", "direction": -1}, {"id": "04-03", "domain": "行動", "text": "我會把開始的標準設得很高，導致第一步延後。", "direction": 1}, {"id": "04-04", "domain": "行動", "text": "計畫遇到小障礙時，我常重新規劃，卻沒有繼續推進。", "direction": 1}, {"id": "04-05", "domain": "行動", "text": "我能把大目標拆成當下可執行的具體步驟。", "direction": -1}, {"id": "05-01", "domain": "家庭", "text": "家人的期待與我的安排衝突時，我常難以拒絕。", "direction": 1}, {"id": "05-02", "domain": "家庭", "text": "我能在關心家人的同時，說明自己的能力限制。", "direction": -1}, {"id": "05-03", "domain": "家庭", "text": "家人情緒不好時，我常覺得自己有責任讓事情恢復正常。", "direction": 1}, {"id": "05-04", "domain": "家庭", "text": "即使已經付出很多，我仍容易因沒有滿足家庭期待而自責。", "direction": 1}, {"id": "05-05", "domain": "家庭", "text": "面對家庭意見不同，我通常能允許彼此保有不同選擇。", "direction": -1}, {"id": "06-01", "domain": "方向", "text": "有幾個不錯的方向時，我常因比較而久久無法選定下一步。", "direction": 1}, {"id": "06-02", "domain": "方向", "text": "我能先選一個方向試行，再依實際經驗調整。", "direction": -1}, {"id": "06-03", "domain": "方向", "text": "看到新的可能性，我常放下原本的計畫重新考慮。", "direction": 1}, {"id": "06-04", "domain": "方向", "text": "即使做了決定，我仍反覆想另一個選項是否更好。", "direction": 1}, {"id": "06-05", "domain": "方向", "text": "我能說出目前最優先的一件事，以及暫時不做的事情。", "direction": -1}]};
const OPT=['從未','很少','有時','經常','幾乎總是'];
const VALUES=['安全','成長','自由','平衡','連結','真誠','自主','穩定'];
const CAUSES=[['resources','時間、金錢、技能或環境資源不足'],['uncertainty','不確定哪個方向值得投入'],['fear','擔心做不好、被否定或選錯'],['priority','其實沒有那麼想做，或有更重要的事'],['progress','我已經在做，只是進度和期待不同'],['other','其他／以上都不符合']];
const SUGGESTIONS={resources:['真正缺少哪項必要條件？哪些條件可以暫時替代？','列出一項必要資源與一項可行的低成本替代方案。'],uncertainty:['如果不必一次決定未來三年，你願意先試哪個方向？','選一個方向做20分鐘的小型試驗，再記錄感受。'],fear:['你最擔心的後果是什麼？能否降低嘗試的代價？','設計一次即使失敗也不會造成重大損失的練習。'],priority:['這是你真正重視的目標，還是你覺得應該完成的？','寫下支持或放下這個目標的三個理由。'],progress:['你是否忽略了已經完成的進展？','記錄過去一個月實際完成的三件事。'],other:['還有哪些因素是目前的選項沒有涵蓋的？','先記錄下一次出現類似情境時的實際限制與想法。']};
const domainIdeas={'關係':['當你想答應別人的要求時，先確認自己是否真的有餘裕。','下一次遇到請求時，先說「我確認一下再回覆」。'],'價值':['當你因一次表現否定自己時，區分事件和自我評價。','寫下一件已完成的事及一個仍可改善的部分。'],'金錢':['當你對支出反覆猶豫時，先確認可支配預算與必要條件。','為一項支出列出金額、必要性與替代方案。'],'行動':['當你又想多查一份資料時，先確認是否能開始小型實作。','選一個任務，先實作20分鐘並記錄遇到的阻礙。'],'家庭':['當家庭期待與個人安排衝突時，確認自己的可負擔範圍。','試著用一句話表達你能做到與無法做到的部分。'],'方向':['當你又想改換目標時，先用小型實作取得新資訊。','選一個方向做一次低成本嘗試，再決定是否調整。']};
let state={page:'welcome',index:0,answers:Array(30).fill(null),cause:'',value:'',action:'',fit:'',note:'',follow:''};
const app=document.getElementById('app');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function score(q,a){if(!Number.isInteger(a)||a<0||a>4)return null;return q.direction===1?a:4-a;}
function calc(){if(state.answers.some(a=>a===null))throw new Error('尚有題目未作答');let arr=BANK.domains.map(d=>({name:d.name,definition:d.definition,score:0,items:[]}));BANK.questions.forEach((q,i)=>{let d=arr.find(x=>x.name===q.domain);let s=score(q,state.answers[i]);d.score+=s;d.items.push({...q,raw:state.answers[i],score:s});});return arr.sort((a,b)=>b.score-a.score);}
function button(label,fn,secondary=false){return `<button class="btn ${secondary?'secondary':''}" onclick="${fn}">${label}</button>`}
function render(){let h='';if(state.page==='welcome')h=`<div class="hero"><div class="brand">♾ MÖBIUS LIFE LOOP 4.0</div><h1>看見模式，驗證理解，重新選擇</h1><p>30個生活情境 · 六大循環 · 一個有依據的發現 · 一個值得探索的問題 · 一個可親自驗證的選擇</p><p class="note">研究原型，不是心理診斷或經驗證的心理量表。請回想過去三個月的真實情況。</p>${button('開始探索','start()')}</div><div class="card"><h3>隱私與研究說明</h3><p>這個離線原型不會上傳或自動儲存你的答案。若自行匯出JSON，檔案只會下載到你的裝置。正式研究版應另設明確同意與隱私政策。</p></div>`;
else if(state.page==='quiz'){let i=state.index,q=BANK.questions[i];h=`<p class="tag">${esc(q.domain)}循環 · ${i+1} / 30</p><div class="progress"><div style="width:${(i+1)/30*100}%"></div></div><div class="card"><h2>${esc(q.text)}</h2><p class="muted">過去三個月，這種情況出現的頻率？</p><div class="choices">${OPT.map((x,n)=>`<label class="choice"><input type="radio" name="q" value="${n}" ${state.answers[i]===n?'checked':''} onchange="choose(${n})">${x}</label>`).join('')}</div><div class="row">${button('上一題','prev()',true)}<button class="btn" ${state.answers[i]===null?'disabled':''} onclick="next()">${i===29?'查看探索結果':'下一題'}</button></div></div><p class="note">請依實際經驗回答，不存在標準答案。題目中的「能做到」不代表道德上比較好。</p>`;}
else if(state.page==='results'){let arr=calc(),top=arr[0],second=arr[1],ties=arr.filter(x=>x.score===top.score);let evidence=top.items.filter(x=>x.score>=3&&x.direction===1).sort((a,b)=>b.score-a.score);h=`<div class="hero"><div class="brand">YOUR DISCOVERY</div><h1>你的探索已完成</h1><p>我們只根據你的作答描述傾向，不替你判定深層原因。</p></div><div class="card"><h3>六大循環地圖</h3>${arr.map(d=>`<div class="score"><strong>${d.name}</strong><div class="bar"><div style="width:${d.score*5}%"></div></div><span>${d.score}/20</span></div>`).join('')}<p class="note">分數表示本次題目中的反應頻率指標，不是健康程度、診斷或跨版本可比的百分位數。</p></div><div class="card"><p class="tag">01｜有答案依據的發現</p><h2>${ties.length>1?'有多個領域呈現相同的最高指標':`本次最值得探索的是「${top.name}」領域`}</h2><p>${esc(top.definition)}。${second.score>=top.score-2?'「'+second.name+'」的分數也相近；兩者的先後排序不宜過度解讀。':''}</p>${evidence.length?evidence.slice(0,3).map(q=>`<div class="evidence"><strong>${q.id}</strong> ${esc(q.text)}<br><small>你的回答：${OPT[q.raw]} · 此題探索指標 ${q.score}/4</small></div>`).join(''):'<p>目前沒有任何單題達到高頻指標；不宜推論明顯的核心反應。</p>'}<p class="note">反向題反映較少出現保護性反應，不可直接視為某個負面行為的高頻證據。這些答案只支持「你如何描述自己的反應」，不直接證明背後原因。</p></div><div class="card"><p class="tag">02｜值得探索的問題</p><h2>${esc(domainIdeas[top.name][0])}</h2><p>這只是探索提示，尚未確定原因。下一步請自行校準。</p>${button('確認可能原因','goCalibrate()')}</div><details><summary>展開完整30題答案與計分依據</summary>${arr.map(d=>`<h3>${d.name} ${d.score}/20</h3>${d.items.map(q=>`<p><small>${q.id} ${esc(q.text)}<br>回答：${OPT[q.raw]}；指標 ${q.score}/4 ${q.direction===-1?'（反向題）':''}</small></p>`).join('')}`).join('')}</details>`;}
else if(state.page==='calibrate'){let top=calc()[0];h=`<div class="card"><p class="tag">02｜原因校準</p><h2>關於「${top.name}」領域，你認為最重要的背景因素是什麼？</h2><p>這不是系統猜出的心理真相，而是由你確認的可能原因。如果結果不符合，請優先指出不符合之處。</p><div class="choices">${CAUSES.map(([k,v])=>`<label class="choice"><input type="radio" name="cause" ${state.cause===k?'checked':''} onchange="setCause('${k}')">${v}</label>`).join('')}</div>${state.cause?`<div class="evidence"><strong>值得探索的問題</strong><p>${esc(SUGGESTIONS[state.cause][0])}</p></div>`:''}<h3>你覺得先前的探索描述符合嗎？</h3><div class="choices">${['非常符合','部分符合','不符合','不確定'].map(v=>`<label class="choice"><input type="radio" name="fit" ${state.fit===v?'checked':''} onchange="setFit('${v}')">${v}</label>`).join('')}</div>${state.fit==='不符合'?'<div class="evidence">謝謝指出不符合。本次分數不代表已找到你的主要問題；建議以你的實際情境為準，並選擇「先記錄」的行動。</div>':''}<label>你希望補充的情況（選填）<textarea id="note" rows="3" placeholder="例如：其實我已經開始，只是工作時間不足。">${esc(state.note)}</textarea></label><div class="row">${button('返回結果','backResults()',true)}<button class="btn" ${!state.cause||!state.fit?'disabled':''} onclick="toChoice()">繼續選擇轉折點</button></div></div>`;}
else if(state.page==='choice'){let top=calc()[0],base=SUGGESTIONS[state.cause]||['還有哪些因素尚未被看見？','記錄一次真實情境。'];h=`<div class="card"><p class="tag">03｜MÖBIUS CHOICE POINT</p><h2>選擇一個你願意親自驗證的行動</h2><p><strong>你的探索問題：</strong>${esc(base[0])}</p><h3>你現在最想守護的價值是什麼？</h3><div class="choices">${VALUES.map(v=>`<label class="choice"><input type="radio" name="value" ${state.value===v?'checked':''} onchange="setValue('${v}')">${v}</label>`).join('')}</div><h3>你願意嘗試哪個小步驟？</h3><div class="choices">${[base[1],domainIdeas[top.name][1],'我想先記錄下一次類似情境，不急著改變'].filter((v,i,a)=>a.indexOf(v)===i).map((v,i)=>`<label class="choice"><input type="radio" name="action" ${state.action===v?'checked':''} onchange="setAction(${JSON.stringify(v).replace(/"/g,'&quot;')})">${esc(v)}</label>`).join('')}</div><div class="row">${button('返回校準','goCalibrate()',true)}<button class="btn" ${!state.value||!state.action?'disabled':''} onclick="finish()">產生我的探索卡</button></div></div>`;}
else if(state.page==='final'){let arr=calc(),top=arr[0],ev=top.items.filter(x=>x.score>=3).sort((a,b)=>b.score-a.score).slice(0,3),p=SUGGESTIONS[state.cause];h=`<div class="hero"><div class="brand">♾ MÖBIUS CHOICE POINT</div><h1>你的個人探索卡</h1><p class="tag">01｜有依據的發現</p><p>在本次作答中，「${top.name}」是相對較常出現的探索領域（${top.score}/20）。</p><p class="note">支持答案：${ev.length?ev.map(x=>esc(x.id)+' '+esc(OPT[x.raw])).join('、'):'目前無高頻正向反應題，請保留不確定性'}。</p><p class="tag">02｜值得探索的問題</p><p>${esc(p[0])}</p><p class="tag">03｜我願意驗證的選擇</p><p>${esc(state.action)}</p><p>我希望這個選擇符合我的價值：<strong>${esc(state.value)}</strong></p>${state.fit==='不符合'?'<p class="note">你表示原始描述不符合，因此這張卡僅記錄你的自選問題與行動，不代表原先推論成立。</p>':''}<p class="note">原因是由你自行選擇的可能解釋，並非測驗已經證實。沒有完成行動，也不代表你失敗。</p></div><div class="card"><h3>真實生活回顧（選填）</h3><p>你可以在實際嘗試後回來，選擇一個狀態。這個原型不會永久保存。</p><div class="choices">${['尚未嘗試','已嘗試，有幫助','已嘗試，沒有明顯幫助','目前條件不允許'].map(v=>`<label class="choice"><input type="radio" name="follow" ${state.follow===v?'checked':''} onchange="setFollow('${v}')">${v}</label>`).join('')}</div><div class="row">${button('下載個人探索JSON','download()')}${button('重新測驗','reset()',true)}</div><p class="note">下載內容含逐題答案與自填備註，請妥善保管。沒有資料傳到伺服器。</p></div>`;}
app.innerHTML=h;}
function start(){state.page='quiz';render()};function choose(n){state.answers[state.index]=n;render()};function prev(){if(state.index>0)state.index--;render()};function next(){if(state.answers[state.index]===null)return;if(state.index<29)state.index++;else state.page='results';render();window.scrollTo(0,0)};
function goCalibrate(){state.page='calibrate';render();window.scrollTo(0,0)};function backResults(){state.page='results';render()};function preserveNote(){const el=document.getElementById('note');if(el)state.note=el.value};function setCause(v){preserveNote();state.cause=v;state.action='';render()};function setFit(v){preserveNote();state.fit=v;render()};function toChoice(){state.note=document.getElementById('note')?.value||'';state.page='choice';render();window.scrollTo(0,0)};function setValue(v){state.value=v;render()};function setAction(v){state.action=v;render()};function finish(){state.page='final';render();window.scrollTo(0,0)};function setFollow(v){state.follow=v;render()};function reset(){if(confirm('重新開始會清除這個頁面目前的作答，確定嗎？')){state={page:'welcome',index:0,answers:Array(30).fill(null),cause:'',value:'',action:'',fit:'',note:'',follow:''};render()}};
